# CI for NexTalk.
#   pull_request -> validation only (lint, tests, build, image smoke test).
#   push to main -> the same checks again (re-validates what was merged).
# The deploy job runs only on push to main, after every check above has
# passed, and triggers Render through a deploy hook. Render's own Auto-Deploy
# must be Off, otherwise Render would deploy before/without these checks.
#
# Pull-request runs never see the deploy secret (the deploy job is skipped for
# them), so the workflow is safe for pull requests from forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded PR runs; never cancel a run on main (a later deploy job
# must not be interrupted halfway).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # mongodb-memory-server downloads a real mongod binary on first use.
      # Pin its cache location so actions/cache can keep it between runs.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          # The default mongod version is tied to the mongodb-memory-server
          # version, which is pinned by the lockfile.
          key: mongod-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - name: Test
        run: npm test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Builds the real production image and runs it against a real MongoDB, so
  # Dockerfile regressions and startup/shutdown regressions fail the PR.
  image:
    name: image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # A syntactically valid but fake Clerk key (pk_test_ + base64 of a
      # domain). It is not a secret; CI never talks to Clerk.
      - name: Build image
        run: |
          PK="pk_test_$(printf 'ci.clerk.accounts.dev$' | base64 -w0)"
          echo "CI_CLERK_PK=$PK" >> "$GITHUB_ENV"
          docker build --build-arg VITE_CLERK_PUBLISHABLE_KEY="$PK" -t nextalk:ci .

      - name: Image has production dependencies only and runs as non-root
        run: |
          docker run --rm --entrypoint sh nextalk:ci -c '
            test -d node_modules/@clerk/backend &&
            test ! -d node_modules/nodemon &&
            test ! -d node_modules/vitest &&
            test "$(id -u)" != "0"'

      - name: Start container
        run: |
          docker run -d --name nextalk-ci --network host \
            -e NODE_ENV=production -e PORT=3001 \
            -e MONGO_URI=mongodb://127.0.0.1:27017/nextalk-ci \
            -e FRONTEND_URL=http://127.0.0.1:3001 \
            -e CLERK_SECRET_KEY=sk_test_ci \
            -e CLERK_PUBLISHABLE_KEY="$CI_CLERK_PK" \
            -e IMAGEKIT_PRIVATE_KEY=ci \
            nextalk:ci

      - name: Wait until ready (MongoDB connected)
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/ready || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "last /ready status: $code"
          [ "$code" = "200" ]

      - name: Liveness and static frontend
        run: |
          curl -fsS http://127.0.0.1:3001/health
          curl -fsS http://127.0.0.1:3001/ | grep -q '<div id="root">'

      - name: Graceful shutdown on SIGTERM
        run: |
          docker stop -t 15 nextalk-ci
          docker logs nextalk-ci > shutdown.log 2>&1
          grep -q '\[shutdown\] complete' shutdown.log
          test "$(docker inspect -f '{{.State.ExitCode}}' nextalk-ci)" = "0"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs nextalk-ci || true

  # Deploys exactly the commit that passed CI, then proves it is live.
  # Requires (Settings -> Secrets and variables -> Actions):
  #   secret   RENDER_DEPLOY_HOOK_URL  Render service -> Settings -> Deploy Hook
  #   variable PRODUCTION_URL          e.g. https://<service>.onrender.com
  deploy:
    name: deploy
    needs: [backend, frontend, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # One production deploy at a time; a newer push waits instead of
    # cancelling a deploy that is already in progress.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check deploy configuration
        run: |
          [ -n "$DEPLOY_HOOK" ] || { echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set"; exit 1; }
          [ -n "$PRODUCTION_URL" ] || { echo "::error::Repository variable PRODUCTION_URL is not set"; exit 1; }

      # ref pins the deploy to this commit rather than "latest on main", so a
      # second merge cannot sneak in untested code. The hook URL is a secret
      # and is never echoed.
      - name: Trigger Render deploy of this commit
        run: |
          curl -fsS -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}" > /dev/null
          echo "Deploy triggered for ${GITHUB_SHA}"

      # /ready reports the commit only once the app is up with MongoDB
      # connected. During a zero-downtime deploy the old instance keeps
      # answering with the old commit until the new one passes its health
      # check, so "commit == this commit" means the new version is serving.
      - name: Wait until this commit is live and ready
        run: |
          url="${PRODUCTION_URL%/}/ready"
          for i in $(seq 1 75); do
            body=$(curl -s -m 10 "$url" || true)
            live=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live commit matches ${GITHUB_SHA}"
              exit 0
            fi
            echo "[$i/75] live commit: ${live:-<not ready>}"
            sleep 20
          done
          echo "::error::${GITHUB_SHA} was not live within 25 minutes. Check the Render deploy logs."
          exit 1
